<text x="86" y="299" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#506477" text-anchor="start">Failed SMB logins</text>
<text x="86" y="353" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#506477" text-anchor="start">192.168.226.133</text>
