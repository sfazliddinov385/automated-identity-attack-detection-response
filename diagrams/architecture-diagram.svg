<text x="468" y="256" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#182b40" text-anchor="start">DC-01</text>
<text x="468" y="299" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#506477" text-anchor="start">Windows Security logs</text>
<text x="468" y="353" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#506477" text-anchor="start">192.168.226.132</text>
<rect x="828" y="212" width="326" height="174" rx="8" fill="white" stroke="#c4d0dc" stroke-width="1.6"/>
<text x="850" y="256" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#182b40" text-anchor="start">SIEM-01</text>
<text x="850" y="299" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#506477" text-anchor="start">Splunk + Python connector</text>
<text x="850" y="353" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#506477" text-anchor="start">192.168.226.129</text>
<rect x="1210" y="212" width="326" height="174" rx="8" fill="white" stroke="#c4d0dc" stroke-width="1.6"/>
<text x="1232" y="256" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#182b40" text-anchor="start">SOAR-01</text>
<text x="1232" y="299" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#506477" text-anchor="start">Shuffle</text>
<text x="1232" y="353" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#506477" text-anchor="start">192.168.226.134</text>
