<path d="M 779 297 H 820" fill="none" stroke="#28699f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 1161 297 H 1202" fill="none" stroke="#28699f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="64" y="453" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#182b40" text-anchor="start">Response</text>
<path d="M 1373 392 V 452 H 272 V 509" fill="none" stroke="#28699f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="855" y="438" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#28699f" text-anchor="middle">POST /disable-users</text>
<rect x="64" y="520" width="416" height="184" rx="8" fill="white" stroke="#c4d0dc" stroke-width="1.6"/>
<text x="86" y="565" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#182b40" text-anchor="start">Approval required</text>
<text x="86" y="610" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#506477" text-anchor="start">No accounts changed</text>
<text x="86" y="657" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#506477" text-anchor="start">HTTP 202 · pending_approval</text>
<rect x="592" y="520" width="416" height="184" rx="8" fill="white" stroke="#c4d0dc" stroke-width="1.6"/>
<text x="614" y="565" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#182b40" text-anchor="start">Approve request</text>
<text x="614" y="610" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#506477" text-anchor="start">Approve on DC-01</text>
<text x="614" y="657" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#506477" text-anchor="start">Resend same alert from Shuffle</text>
<rect x="1120" y="520" width="416" height="184" rx="8" fill="white" stroke="#147d64" stroke-width="1.6"/>
<text x="1142" y="565" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#182b40" text-anchor="start">Disable + verify in AD</text>
<text x="1142" y="610" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#506477" text-anchor="start">Disable the five lab accounts</text>
<text x="1142" y="657" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#147d64" text-anchor="start">Confirm all five are disabled</text>
