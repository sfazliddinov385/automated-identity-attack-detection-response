<rect x="64" y="820" width="1472" height="76" rx="8" fill="white" stroke="#c4d0dc" stroke-width="1.6"/>
<text x="86" y="869" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#182b40" text-anchor="start">DC-01: Event 4725</text>
<path d="M 355 859 H 421" fill="none" stroke="#28699f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="451" y="869" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#182b40" text-anchor="start">Splunk</text>
<text x="738" y="869" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#506477" text-anchor="start">Check the audit events manually</text>
