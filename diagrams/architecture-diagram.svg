<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">Identity attack detection and response</title>
<desc id="desc">Failed logins on VICTIM-B produce Windows logs on DC-01. Splunk and its connector send a detection to Shuffle. The responder requires approval on DC-01, followed by resubmission of the same alert from Shuffle. It then disables the five lab accounts and verifies their state in Active Directory. Event 4725 is separately checked in Splunk.</desc>
<defs>
<marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#28699f"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#147d64"/></marker>
</defs>
<rect width="1600" height="940" fill="#f7f9fc"/>
