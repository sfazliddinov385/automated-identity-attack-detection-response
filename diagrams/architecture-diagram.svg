<path d="M 1016 608 H 1112" fill="none" stroke="#147d64" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="64" y="781" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#182b40" text-anchor="start">Audit</text>
